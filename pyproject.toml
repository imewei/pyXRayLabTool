[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xraylabtool"
version = "0.4.8"
authors = [
    {name = "Wei Chen", email = "wchen@anl.gov"},
]
maintainers = [
    {name = "Wei Chen", email = "wchen@anl.gov"},
]
description = "Ultra-fast Python package for X-ray optical properties calculation with CXRO/NIST data, CLI tools, and synchrotron applications"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    # Development Status
    "Development Status :: 5 - Production/Stable",

    # Intended Audience
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Healthcare Industry",

    # Operating System
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",

    # Programming Language
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",

    # Topics
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Shells",
    "Topic :: Utilities",

    # Environment
    "Environment :: Console",

    # Natural Language
    "Natural Language :: English",

    # Typing
    "Typing :: Typed",
]
keywords = [
    # Core X-ray terms
    "xray", "x-ray", "xrd", "xrr", "saxs", "crystallography", "diffraction", "scattering",
    "synchrotron", "beamline", "optics", "reflectometry", "absorption", "spectroscopy",

    # Scientific domains
    "materials-science", "condensed-matter", "physics", "chemistry", "nanotechnology",
    "thin-films", "multilayers", "nanostructures", "characterization",

    # Data sources and methods
    "cxro", "nist", "atomic-scattering-factors", "optical-constants", "refractive-index",
    "critical-angle", "attenuation-length", "form-factors", "dispersion", "absorption-coefficient",

    # Technical capabilities
    "high-performance", "vectorized", "batch-processing", "parallel-processing",
    "scientific-computing", "numerical-analysis", "laboratory", "analysis",

    # Interface and usability
    "cli", "command-line", "python-package", "api", "cross-platform",
    "shell-completion", "bash-completion", "zsh-completion", "fish-completion",
    "powershell-completion", "tab-completion", "virtual-environment", "environment-isolation",

    # Applications
    "materials-characterization", "structure-analysis", "quality-control",
    "medical-imaging", "industrial-radiography", "non-destructive-testing"
]

# One flat list on purpose: `uv sync` / `pip install -e .` gives a complete
# development environment (see CLAUDE.md). Every entry is imported or invoked
# somewhere in this repository -- add a package here together with its first use.
dependencies = [
    # Core runtime
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "scipy>=1.16.3",
    "mendeleev>=1.1.0",
    "tqdm>=4.67.1",
    "psutil>=7.1.3",

    # JAX ecosystem — CPU-only base (works on all platforms)
    # GPU users: install gpu_cuda12 or gpu_cuda13 extra (see below)
    "jax>=0.8.0",
    "jaxlib>=0.8.0",
    "interpax>=0.3.0",

    # Desktop GUI
    "PySide6>=6.10.1",
    "pyqtgraph>=0.13.7",

    # Plotting for the example notebooks and publication figures. The package
    # itself does not import it (the GUI plots with pyqtgraph, see ADR-002), but
    # docs/guides/getting_started.rst lists it as part of the core install.
    "matplotlib>=3.10.8",

    # Testing
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-benchmark>=5.2.3",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",  # CI runs the GUI tests with --timeout=30

    # Linting, formatting, type checking (floors match the pins in
    # .pre-commit-config.yaml and .github/workflows)
    "mypy>=1.20.0",
    "ruff>=0.17.2",
    "pandas-stubs>=2.3.3.251201",
    "types-tqdm>=4.67.0.20250809",
    "types-psutil>=7.1.3.20251202",
    "pre-commit>=4.5.0",

    # Build and publish
    "build>=1.0.0",
    "twine>=4.0.0",

    # Documentation
    "sphinx>=8.2.3",
    "furo>=2025.9.25",
    "sphinx-autodoc-typehints>=3.5.2",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "sphinx-tabs>=3.4.7",
    "sphinx-togglebutton>=0.3.2",
    "myst-parser>=4.0.1",
    "nbsphinx>=0.9.8",
    "doc8>=2.0.0",
    "rstcheck>=6.2.5",
]

[project.optional-dependencies]
gpu_cuda13 = [
    # CUDA 13 GPU support (SM >= 7.5: Turing+) — versions must match jaxlib
    "jax-cuda13-plugin>=0.8.0",
    "jax-cuda13-pjrt>=0.8.0",
]
gpu_cuda12 = [
    # CUDA 12 GPU support (SM >= 5.2: Maxwell+) — versions must match jaxlib
    "jax-cuda12-plugin>=0.8.0",
    "jax-cuda12-pjrt>=0.8.0",
]
[project.urls]
Homepage = "https://github.com/imewei/pyXRayLabTool"
Documentation = "https://pyxraylabtool.readthedocs.io"
Repository = "https://github.com/imewei/pyXRayLabTool"
"Source Code" = "https://github.com/imewei/pyXRayLabTool"
"Bug Tracker" = "https://github.com/imewei/pyXRayLabTool/issues"
"Changelog" = "https://github.com/imewei/pyXRayLabTool/blob/main/CHANGELOG.md"
"CLI Reference" = "https://pyxraylabtool.readthedocs.io/en/latest/guides/cli_reference.html"
"Shell Completion Guide" = "https://pyxraylabtool.readthedocs.io/en/latest/guides/completion_guide.html"
"Discussions" = "https://github.com/imewei/pyXRayLabTool/discussions"
"Release Notes" = "https://github.com/imewei/pyXRayLabTool/releases"

[tool.uv]
package = true
# GPU extras are mutually exclusive — only ONE CUDA plugin set can be active.
# Without this, `uv sync --all-extras` installs both cuda12 and cuda13 plugins
# simultaneously, causing PJRT_Api ALREADY_EXISTS registration conflicts.
conflicts = [
    [
        { extra = "gpu_cuda12" },
        { extra = "gpu_cuda13" },
    ],
]

[project.scripts]
xraylabtool = "xraylabtool.interfaces.cli:main"
xraylabtool-gui = "xraylabtool.gui.__main__:main"
# Short aliases
xtool = "xraylabtool.interfaces.cli:main"
xtool-gui = "xraylabtool.gui.__main__:main"
xlt = "xraylabtool.interfaces.cli:main"
xlt-gui = "xraylabtool.gui.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["xraylabtool*"]
exclude = ["tests*", "docs*", "*.tests*", "*.tests"]

[tool.setuptools.package-data]
xraylabtool = [
    "data/AtomicScatteringFactor/*.nff",
    "py.typed",  # PEP 561 typing marker
]


[tool.pytest.ini_options]
minversion = "9.0"
addopts = [
    "-ra",  # Show all test outcomes except passed
    "--strict-markers",  # Treat unknown marks as errors
    "--strict-config",  # Treat unknown config options as errors
    "--cov=xraylabtool",  # Coverage for main package
    "--cov-branch",  # Branch coverage
    "--cov-report=term-missing",  # Show missing lines
    "--cov-report=html:htmlcov",  # HTML coverage report
    "--cov-report=xml",  # XML coverage report for CI
    "--tb=short",  # Shorter traceback format
    "--durations=10",  # Show 10 slowest tests
    "-v",  # Verbose output
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    # Test categories (most tests are selected by directory: tests/unit, tests/integration, ...)
    "unit: marks tests as unit tests (individual components)",
    "integration: marks tests as integration tests (end-to-end workflows)",
    "performance: Performance benchmark tests (deselected by default, use --run-performance)",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: marks tests as benchmark tests",

    # Assigned automatically by tests/conftest.py from the test name
    "memory: marks tests that check memory usage and management",
    "stability: marks tests that check numerical stability",
    "regression: marks tests that check for performance regressions",
    "large_data: marks tests that use large datasets (may require more memory)",
]
filterwarnings = [
    "error",  # Treat warnings as errors by default
    # Ignore specific warnings
    # pytest-benchmark warns (and, under filterwarnings=error, hard-fails with an
    # INTERNALERROR) when it auto-disables itself under pytest-xdist. This fires in
    # any pytest process that has both plugins active, including subprocesses that
    # tests spawn. Benchmarks are deselected by default, so silence it.
    "ignore::pytest_benchmark.logger.PytestBenchmarkWarning",
    "ignore::ResourceWarning",
    "ignore:unclosed database in:ResourceWarning",
    "ignore::DeprecationWarning:tests.*",
    "ignore::DeprecationWarning:xraylabtool.*",
    "ignore::PendingDeprecationWarning",
    # NumPy warnings
    "ignore:.*numpy.ndarray size changed.*:RuntimeWarning",
    "ignore:.*numpy.ufunc size changed.*:RuntimeWarning",
    # Scientific computing warnings that are typically safe to ignore
    "ignore:.*divide by zero.*:RuntimeWarning",
    "ignore:.*invalid value.*:RuntimeWarning",
    # Matplotlib warnings
    "ignore:.*Agg backend.*:UserWarning",
    "ignore:.*tight_layout.*:UserWarning",
    # Performance optimization warnings
    "ignore:.*performance.*:UserWarning",
]
# Logging configuration
log_auto_indent = true
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_file = "tests/logs/pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
# Test collection settings
norecursedirs = [
    "build",
    "dist",
    ".tox",
    ".eggs",
    "venv",
    ".venv",
]
# Parallel execution: pass "-n auto" (pytest-xdist); GUI tests must run serially (see Makefile)
# Note: Performance baseline file is located at tests/data/performance_baselines.json

[tool.mypy]
python_version = "3.12"
# Only the package is type-checked (Makefile, CI and pre-commit all do the same);
# tests/ is not yet annotated.
files = ["xraylabtool"]
show_error_codes = true
pretty = true

# Enhanced strict mode settings
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
disallow_any_generics = true
disallow_subclassing_any = true
# jax.config.update is untyped upstream; keeps `mypy --strict` clean without ignores.
untyped_calls_exclude = ["jax"]

# Enhanced type safety warnings
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Additional strict settings for enhanced type safety
disallow_any_unimported = true
disallow_any_expr = false  # Too strict for scientific computing with NumPy
no_implicit_reexport = true
extra_checks = true  # replaces the deprecated strict_concatenate

# Performance optimizations
cache_dir = ".mypy_cache"
sqlite_cache = true
incremental = true
follow_imports = "normal"

# Error output
show_column_numbers = true
show_error_context = true
color_output = true
error_summary = true

[[tool.mypy.overrides]]
# Third-party libraries without stubs
module = [
    "scipy.*",
    "mendeleev.*",
    "tqdm.*",
    "jax.*",
    "jaxlib.*",
    "interpax.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# mendeleev defines `element` in a submodule without listing it in __all__
module = "mendeleev"
implicit_reexport = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
    "A",   # flake8-builtins
    "RUF", # Ruff-specific rules
    "PL",  # pylint (convention, error, refactor, warning)
]
ignore = [
    "E501",  # line too long (ruff format wraps what it can)
    "PLR0913",  # too many arguments
    "PLR0917",  # too many positional arguments (public API signatures are positional by design)
    "PLR2004",  # magic value used in comparison
    "S101",  # assert statements (used in tests)
    "S603",  # subprocess call (we use subprocess safely)
    "N802",  # function name should be lowercase (scientific naming conventions)
    "N803",  # argument name should be lowercase (scientific naming conventions)
    "PLC0414",  # import alias does not rename original package
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    ".eggs",
    ".tox",
    "docs",
]

[tool.ruff.lint.per-file-ignores]
# Every code below fires on the files its pattern matches (checked by running ruff
# with the code selected); codes covered by the global `ignore` are not repeated.
# S-series ignores are needed by the CI security job (`ruff check --select S`), which the
# default `select` below does not run, so check them with `--select S` before pruning.
# NOTE: in ruff globs `*` also matches across directories.
"tests/*" = ["ARG", "PLC0415", "S311", "RUF002", "RUF003", "RUF012", "S110", "N806", "B007", "B905", "S607", "F401", "PLW0603", "PLW2901", "SIM102", "S102", "SIM117", "E402"]
"xraylabtool/interfaces/cli/**.py" = ["PLC0415", "PLR0911", "ARG001", "S101"]  # CLI lazy imports, complexity, unused handler args, assert guarding parsed data
"xraylabtool/analysis/*.py" = ["SIM102", "B904"]  # Analysis module patterns
"__init__.py" = ["F401", "PLR0911", "PLC0415"]  # Re-exports, complexity and lazy imports in __init__.py
# Completion system: shell-script generators and rc-file integration
"**/interfaces/completion_v2/*.py" = ["PLR0911", "SIM112", "S603", "S604", "ARG001", "ARG002", "SIM118", "S112", "PLW2901", "RUF001", "PLC0415", "S110", "S607"]
# Scientific computing files with performance-critical lazy imports
"**/utils.py" = ["PLC0415", "ARG001"]  # Lazy imports and unused args in utility functions
"**/typing_extensions.py" = ["PLC0415"]  # Lazy imports for compatibility
"**/validation/validators.py" = ["PLC0415"]  # Lazy imports in validators
"**/data_handling/*.py" = ["PLC0415", "PLW0603", "A002"]  # Lazy imports, module-level caches, parameter names
"**/io/*.py" = ["PLC0415"]  # Lazy imports in I/O
"xraylabtool/gui/*.py" = ["PLR0915", "PLR1714", "PLC0415"]
"xraylabtool/backend/*.py" = ["PLC0415", "PLW0603"]  # Lazy imports and global state are intentional in the backend abstraction layer
"xraylabtool/calculators/cache.py" = ["PLC0415"]  # Deferred imports to break circular dependency
"xraylabtool/calculators/kernels.py" = ["PLC0415"]  # Deferred imports for JIT and constants
"xraylabtool/calculators/scattering_data.py" = ["PLC0415"]  # Deferred imports for cache and pandas
"xraylabtool/device.py" = ["PLC0415", "SIM105", "S603"]  # Lazy imports for optional JAX; try/except for optional packages; fixed-argv nvcc/nvidia-smi calls
"scripts/run_type_check.py" = ["PLR0912", "PLR0915"]  # Allow complex functions in type checking script
"scripts/test_docs.py" = ["PLR0912", "PLR0915", "S112", "S607"]  # Allow complex functions and subprocess calls in documentation testing script
"scripts/validate_style_guide.py" = ["PLW2901", "SIM102", "S607", "PLR0912", "PLR0915", "PLC0415"]  # Allow style validation patterns
"benchmarks/*.py" = ["PLC0415", "PLW1510"]  # Lazy imports and subprocess without check are intentional in benchmark scripts
"docs/**" = ["RUF001", "RUF003", "PLC2401"]  # Greek letters and ×, µ, – are intentional in docs/conf.py and the example notebooks

[tool.ruff.lint.isort]
known-first-party = ["xraylabtool"]
force-sort-within-sections = true

[tool.coverage.run]
source = ["xraylabtool"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/conftest.py",
    # Exclude modules with specialized functionality that have limited test coverage
    "*/gui/*",                             # GUI module - requires PySide6/Qt infrastructure
    "*/interfaces/completion_v2/*",        # Shell completion - bash/zsh/fish + rc-file integration tested
    "*/io/*",                              # File export/IO - integration tested, not unit-covered
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self\\.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

# pip-audit configuration
[tool.pip-audit]
# CVE-2026-3219: pip handles concatenated tar+ZIP files as ZIP files.
# Affects pip itself (not a project dependency). Fixed in pip>=26.1 (uv.lock pins 26.1.1).
ignore-vuln = ["CVE-2026-3219"]

[dependency-groups]
dev = [
    "pip-audit>=2.10.0",
    "pip-licenses>=5.5.5",
]
