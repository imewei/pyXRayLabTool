{% set pyproject = load_file_data("../pyproject.toml", from_recipe_dir=True) %}
{% set version = pyproject["project"]["version"] %}

package:
  name: xraylabtool
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - xraylabtool = xraylabtool.interfaces.cli:main
    - xraylabtool-gui = xraylabtool.gui.__main__:main
    - xtool = xraylabtool.interfaces.cli:main
    - xtool-gui = xraylabtool.gui.__main__:main
    - xlt = xraylabtool.interfaces.cli:main
    - xlt-gui = xraylabtool.gui.__main__:main

requirements:
  host:
    - python >=3.12
    - pip
    - setuptools >=77.0
  run:
    - python >=3.12
    - numpy >=2.3.5
    - pandas >=2.3.3
    - scipy >=1.16.3
    - mendeleev >=1.1.0
    - tqdm >=4.67.1
    - psutil >=7.1.3
    - jax >=0.12.0.1
    - jaxlib >=0.12.0.1
    - interpax >=0.3.0
    - pyside6 >=6.10.1
    - pyqtgraph >=0.13.7
    - matplotlib-base >=3.10.8

test:
  imports:
    - xraylabtool
  commands:
    - xraylabtool --version
    - xlt --version
    - xraylabtool calc SiO2 -e 10.0 -d 2.2

about:
  home: https://github.com/imewei/pyXRayLabTool
  summary: {{ pyproject["project"]["description"] }}
  license: MIT AND Zlib
  license_file:
    - LICENSE
    - NOTICE
    - xraylabtool/data/kkcalc/LICENSE-kkcalc.txt
  doc_url: https://pyxraylabtool.readthedocs.io
  dev_url: https://github.com/imewei/pyXRayLabTool
